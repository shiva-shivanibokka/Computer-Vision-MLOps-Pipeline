name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install ".[dev,mlops]"
      - name: Lint
        run: ruff check .
      - name: Unit tests (fast)
        run: pytest -m "not heavy" -q

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install ".[dev,mlops]"
      - name: End-to-end smoke (train -> register -> promote)
        run: pytest tests/test_smoke_train.py -q

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pcb-defect-detector:ci .

  # No deploy job. New Hugging Face Docker Spaces require a PRO subscription
  # (create_repo returns 402), so the Space this used to push to cannot exist.
  # The demo runs on Cloud Run and is deployed manually with:
  #   gcloud run deploy pcb-defect-detector --source . --region us-central1
  #     --port 7860 --memory 2Gi --cpu 2 --max-instances 1 --cpu-boost
  # max-instances is 1 on purpose: the prediction log is SQLite inside the
  # container, so a second instance would be a second, disagreeing log.
